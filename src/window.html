<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Docs</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #2D2D2D; color: #f2f2f2; font: 13px/1.2 sans-serif; }
    .titlebar {
      position: fixed;
      inset: 0 0 auto;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2D2D2D;
      user-select: none;
      -webkit-app-region: drag;
    }
    .title {
      max-width: calc(100% - 160px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .controls {
      position: absolute;
      inset: 0 0 0 auto;
      display: flex;
      -webkit-app-region: no-drag;
    }
    button {
      display: grid;
      width: 46px;
      height: 40px;
      padding: 0;
      place-items: center;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: default;
    }
    button:hover { background: #454545; }
    button.close:hover { background: #c42b1c; }
    .minimize span { width: 10px; border-top: 1px solid currentColor; }
    .maximize span { width: 10px; height: 10px; border: 1px solid currentColor; }
    .maximize.is-maximized span {
      width: 9px;
      height: 9px;
      border: 1px solid currentColor;
      box-shadow: 2px -2px 0 -1px #2D2D2D, 2px -2px 0 0 currentColor;
    }
    .close span { position: relative; width: 12px; height: 12px; }
    .close span::before, .close span::after {
      position: absolute;
      top: 5px;
      left: 0;
      width: 12px;
      border-top: 1px solid currentColor;
      content: '';
      transform: rotate(45deg);
    }
    .close span::after { transform: rotate(-45deg); }
  </style>
</head>
<body>
  <header class="titlebar">
    <span class="title">Aura Docs</span>
    <div class="controls">
      <button type="button" class="minimize" aria-label="Minimizza" title="Minimizza"><span></span></button>
      <button type="button" class="maximize" aria-label="Massimizza" title="Massimizza"><span></span></button>
      <button type="button" class="close" aria-label="Chiudi" title="Chiudi"><span></span></button>
    </div>
  </header>
  <script>
    const controls = window.windowControls;
    const title = document.querySelector('.title');
    const maximizeButton = document.querySelector('.maximize');

    document.querySelector('.minimize').addEventListener('click', controls.minimize);
    maximizeButton.addEventListener('click', controls.toggleMaximize);
    document.querySelector('.close').addEventListener('click', controls.close);

    controls.onMaximizeState((isMaximized) => {
      maximizeButton.classList.toggle('is-maximized', isMaximized);
      maximizeButton.setAttribute('aria-label', isMaximized ? 'Ripristina' : 'Massimizza');
      maximizeButton.title = isMaximized ? 'Ripristina' : 'Massimizza';
    });
    controls.onDocumentTitle((documentTitle) => {
      title.textContent = documentTitle || 'Aura Docs';
    });
    controls.ready();
  </script>
</body>
</html>
